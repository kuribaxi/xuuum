<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IMDb vi → tt Finder</title>
<style>
body {
    font-family: Arial;
    margin: 40px;
}
input {
    width: 600px;
    padding: 10px;
}
button {
    padding: 10px;
}
#result {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<h2>IMDb Video → tt-ID</h2>

<input id="url" 
value="https://www.imdb.com/video/vi3211246617/"
placeholder="Klistra IMDb videolänk">

<button onclick="findTT()">Hitta TT</button>

<div id="result"></div>


<script>

async function findTT(){

    let url = document.getElementById("url").value;

    let result = document.getElementById("result");

    result.innerHTML = "Hämtar...";


    try {

        let response = await fetch(url, {
            headers:{
                "User-Agent":"Mozilla/5.0"
            }
        });


        let html = await response.text();


        // Leta efter tt-ID
        let matches = html.match(/tt\d{7,9}/g);


        if(matches){

            // ta vanligaste
            let count = {};

            matches.forEach(x=>{
                count[x]=(count[x]||0)+1;
            });


            let tt = Object.keys(count)
                .sort((a,b)=>count[b]-count[a])[0];


            result.innerHTML =
            `
            IMDb ID: <b>${tt}</b><br><br>

            Embed:<br>
            <a href="https://streamimdb.ru/embed/movie/${tt}" target="_blank">
            https://streamimdb.ru/embed/movie/${tt}
            </a>
            `;


        }else{

            result.innerHTML =
            "Hittade inget tt-ID";

        }


    }catch(e){

        result.innerHTML =
        "Fel: " + e;

    }

}

</script>

</body>
</html>
